<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在更新问题六</title>
  <style>
    :root{color-scheme:light;--paper:#F4F0E7;--card:#FFFDF8;--ink:#252B29;--muted:#5F6863;--accent:#28776B}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    main{width:min(440px,100%);padding:28px;border:1px solid #E5DED1;border-radius:20px;background:var(--card);box-shadow:0 16px 40px -28px rgba(37,43,41,.45);text-align:center}
    h1{margin:0 0 10px;font-size:22px}
    p{margin:0;color:var(--muted);line-height:1.8}
    a{display:inline-block;margin-top:18px;padding:11px 18px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>正在更新问题六</h1>
    <p id="status">正在清除旧版缓存，请稍候……</p>
    <a id="fallback" href="./?v=8" hidden>打开最新版</a>
  </main>
  <script>
    (async function () {
      var status = document.getElementById('status');
      var fallback = document.getElementById('fallback');
      try {
        if ('serviceWorker' in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys
            .filter(function (key) { return key.indexOf('jlpt-n2-q4') === 0; })
            .map(function (key) { return caches.delete(key); }));
        }
        status.textContent = '更新完成，正在打开最新版……';
        window.setTimeout(function () {
          window.location.replace('./?v=9&updated=' + Date.now());
        }, 350);
      } catch (error) {
        status.textContent = '自动清理未完成，请点击下方按钮。';
        fallback.hidden = false;
      }
      window.setTimeout(function () { fallback.hidden = false; }, 1800);
    })();
  </script>
</body>
</html>
